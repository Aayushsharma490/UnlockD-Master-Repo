services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # use the container's node_modules, not the host's
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules    # use the container's node_modules, not the host's
      - verdant_db:/app/data  # persist SQLite database across restarts
    environment:
      - JWT_SECRET=verdant_default_dev_secret_key_987654321
      - PORT=3000
      - NODE_ENV=development
    restart: unless-stopped

# Named volume keeps the SQLite DB file alive across `docker-compose down`
volumes:
  verdant_db:
